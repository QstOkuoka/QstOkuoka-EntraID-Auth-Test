
<script>
(async () => {
  const r = await fetch('/api/userinfo', {
    credentials: 'include',
    cache: 'no-store'   // ★重要
  });

  if (r.status === 304) {
    console.error('304 returned. Cache issue.');
    location.reload(true);
    return;
  }

  if (!r.ok) {
    location.href = '/.auth/login/aad';
    return;
  }

  const me = await r.json();
  const roles = Array.isArray(me.roles) ? me.roles : [];

  if (roles.includes('Admin')) {
    location.href = '/admin';
  } else {
    location.href = '/user';
  }
})();
</script>
