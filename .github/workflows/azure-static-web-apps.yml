name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Functions(API) は Node 18 を想定
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build API (optional)
        run: |
          if [ -f "api/package.json" ]; then
            cd api && npm ci && cd -
          fi

      - name: Build App (static) - skip (pure HTML)
        run: echo "no build"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_GLACIER_0495D9700 }}
          action: "upload"
          app_location: "src"            # 静的ファイルのルート
          api_location: "src/api"            # Functions のルート
          output_location: ""            # ビルド出力なし
