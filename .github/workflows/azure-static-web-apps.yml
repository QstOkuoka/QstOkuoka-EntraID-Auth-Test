name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) 取得
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      # （必要なら Node をセットアップ：静的HTMLなら不要）
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'

      # 2) ビルド（今回は HTML 直置きなので不要）

      # 3) デプロイ
      - name: Build and Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload

          # ★最重要：配置パス
          app_location: "src"     # ← フロントのルート
          api_location: "api"     # ← Functions のルート（今回のポイント）
          output_location: ""     # ← ビルドなしなら空

          # 任意：タイムアウト延長など
          # app_build_timeout_in_minutes: 30
